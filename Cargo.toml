[workspace]
resolver = "2"
members = [
    "crates/speediso-core",
    "crates/speediso-detect",
    "crates/speediso-boot",
    "crates/speediso-cli",
]

[workspace.dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
