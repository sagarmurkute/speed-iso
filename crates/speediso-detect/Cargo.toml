[package]
name = "speediso-detect"
version = "0.1.0"
edition = "2021"
description = "Cross-platform storage drive enumeration and system drive protection logic for SpeedISO"

[dependencies]
thiserror.workspace = true
serde.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_WindowsProgramming",
    "Win32_Security",
] }
